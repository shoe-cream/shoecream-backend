name: Backend CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Setup JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'  # 프로젝트 Java 버전에 맞게 조정
          distribution: 'temurin'
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Build with Gradle
        run: ./gradlew clean build -x test
        
      - name: Deploy to Oracle Cloud
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.BACKEND_SERVER_HOST }}
          username: ${{ secrets.BACKEND_SERVER_USER }}
          key: ${{ secrets.BACKEND_SERVER_SSH_KEY }}
          source: "build/libs/*.jar"
          target: "/home/ubuntu/deploy"
          strip_components: 2
      
      - name: Restart Spring Boot
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.BACKEND_SERVER_HOST }}
          username: ${{ secrets.BACKEND_SERVER_USER }}
          key: ${{ secrets.BACKEND_SERVER_SSH_KEY }}
          script: |
            cd /home/ubuntu
            # 기존 프로세스 종료
            pkill -f springboot-starter.jar || true
            sleep 3
            # 새 jar로 교체
            mv deploy/*.jar springboot-starter.jar
            # 백그라운드 실행
            nohup java -jar springboot-starter.jar > app.log 2>&1 &
            sleep 5
            # 실행 확인
            ps aux | grep springboot-starter.jar | grep -v grep
