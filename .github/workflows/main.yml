name: Backend CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Setup JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'  # 프로젝트 Java 버전에 맞게 조정
          distribution: 'temurin'
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Build with Gradle
        run: ./gradlew clean build -x test
        
      - name: Deploy to Oracle Cloud
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.BACKEND_SERVER_HOST }}
          username: ${{ secrets.BACKEND_SERVER_USER }}
          key: ${{ secrets.BACKEND_SERVER_SSH_KEY }}
          source: "build/libs/*.jar"
          target: "/home/ubuntu/deploy"
          strip_components: 2
      
      - name: Restart Spring Boot
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.BACKEND_SERVER_HOST }}
          username: ${{ secrets.BACKEND_SERVER_USER }}
          key: ${{ secrets.BACKEND_SERVER_SSH_KEY }}
          script: |
            cd /home/ubuntu
            # 기존 프로세스 PID 찾아서 종료
            OLD_PID=$(pgrep -f springboot-starter.jar)
            if [ ! -z "$OLD_PID" ]; then
              echo "Killing old process: $OLD_PID"
              kill -15 $OLD_PID
              sleep 5
              # 강제 종료가 필요하면
              kill -9 $OLD_PID 2>/dev/null || true
            fi
            # 새 jar로 교체
            if [ -f deploy/*.jar ]; then
              mv deploy/*.jar springboot-starter.jar
            fi
            # 백그라운드 실행
            nohup java -jar springboot-starter.jar > app.log 2>&1 &
            echo "Started new process"
            sleep 3
            # 실행 확인
            pgrep -f springboot-starter.jar
