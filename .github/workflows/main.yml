name: Backend CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      
      - name: Build with Gradle
        run: ./gradlew clean build -x test
      
      - name: Copy JAR to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.BACKEND_SERVER_HOST }}
          username: ${{ secrets.BACKEND_SERVER_USER }}
          key: ${{ secrets.BACKEND_SERVER_SSH_KEY }}
          source: "build/libs/*.jar"
          target: "/home/ubuntu/app/"
          strip_components: 2
      
      - name: Deploy on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.BACKEND_SERVER_HOST }}
          username: ${{ secrets.BACKEND_SERVER_USER }}
          key: ${{ secrets.BACKEND_SERVER_SSH_KEY }}
          script: |
            cd /home/ubuntu/app
            
            # JAR 파일명 찾기
            JAR_FILE=$(ls *.jar | head -1)
            
            cat > Dockerfile << 'EOF'
            FROM eclipse-temurin:11-jre
            WORKDIR /app
            COPY *.jar app.jar
            EXPOSE 8080
            ENTRYPOINT ["java", "-jar", "app.jar"]
            EOF
            
            docker stop shoecream-backend || true
            docker rm shoecream-backend || true
            docker build -t shoecream-backend:latest .
            
            docker run -d --name shoecream-backend \
              --network host \
              --restart unless-stopped \
              shoecream-backend:latest
            
            sleep 10
            docker ps | grep shoecream-backend
