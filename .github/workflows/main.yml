name: Backend CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      
      - name: Build with Gradle
        run: ./gradlew clean build -x test
      
      - name: Copy JAR to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.BACKEND_SERVER_HOST }}
          username: ${{ secrets.BACKEND_SERVER_USER }}
          key: ${{ secrets.BACKEND_SERVER_SSH_KEY }}
          source: "build/libs/*.jar"
          target: "/home/ubuntu/app/"
          strip_components: 2
      
      - name: Deploy on server
        uses: appleboy/ssh-action@master
        env:
          EC2_IP: ${{ secrets.EC2_IP }}
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          SPRING_MAIL_USERNAME: ${{ secrets.SPRING_MAIL_USERNAME }}
          SPRING_MAIL_PASSWORD: ${{ secrets.SPRING_MAIL_PASSWORD }}
          MAIL_ADDRESS_ADMIN: ${{ secrets.MAIL_ADDRESS_ADMIN }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
          JWT_ACCESS_TOKEN_EXPIRATION_MINUTES: ${{ secrets.JWT_ACCESS_TOKEN_EXPIRATION_MINUTES }}
          JWT_REFRESH_TOKEN_EXPIRATION_MINUTES: ${{ secrets.JWT_REFRESH_TOKEN_EXPIRATION_MINUTES }}
        with:
          host: ${{ secrets.BACKEND_SERVER_HOST }}
          username: ${{ secrets.BACKEND_SERVER_USER }}
          key: ${{ secrets.BACKEND_SERVER_SSH_KEY }}
          envs: EC2_IP,SPRING_DATASOURCE_URL,SPRING_DATASOURCE_USERNAME,SPRING_DATASOURCE_PASSWORD,SPRING_MAIL_USERNAME,SPRING_MAIL_PASSWORD,MAIL_ADDRESS_ADMIN,JWT_KEY,JWT_ACCESS_TOKEN_EXPIRATION_MINUTES,JWT_REFRESH_TOKEN_EXPIRATION_MINUTES
          script: |
            cd /home/ubuntu/app
            
            cat > Dockerfile << 'EOF'
            FROM eclipse-temurin:11-jre
            WORKDIR /app
            COPY *.jar app.jar
            EXPOSE 8080
            ENTRYPOINT ["java", "-jar", "app.jar"]
            EOF
            
            docker stop shoecream-backend || true
            docker rm shoecream-backend || true
            docker build -t shoecream-backend:latest .
            
            docker run -d --name shoecream-backend \
              --network host \
              --restart unless-stopped \
              -e EC2_IP="${EC2_IP}" \
              -e SPRING_DATASOURCE_URL="${SPRING_DATASOURCE_URL}" \
              -e SPRING_DATASOURCE_USERNAME="${SPRING_DATASOURCE_USERNAME}" \
              -e SPRING_DATASOURCE_PASSWORD="${SPRING_DATASOURCE_PASSWORD}" \
              -e SPRING_MAIL_USERNAME="${SPRING_MAIL_USERNAME}" \
              -e SPRING_MAIL_PASSWORD="${SPRING_MAIL_PASSWORD}" \
              -e MAIL_ADDRESS_ADMIN="${MAIL_ADDRESS_ADMIN}" \
              -e JWT_KEY="${JWT_KEY}" \
              -e JWT_ACCESS_TOKEN_EXPIRATION_MINUTES="${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES}" \
              -e JWT_REFRESH_TOKEN_EXPIRATION_MINUTES="${JWT_REFRESH_TOKEN_EXPIRATION_MINUTES}" \
              shoecream-backend:latest
            
            sleep 10
            docker ps | grep shoecream-backend
